version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "NODE_ENV is set to $NODE_ENV"
        - node --version
        - echo "Installing corepack and pnpm..."
        - npm install --global corepack@latest
        - corepack enable
        - corepack prepare pnpm@latest-10 --activate
        - pnpm config set store-dir ~/.pnpm-store
        - pnpm store path
        - pnpm install --frozen-lockfile
        # if we're in dev, swap .env.production for .env.development
        - echo "ENV is '$ENV'"
        - |
          if [ "$ENV" = "dev" ]; then
            echo "→ DEV build: copying .env.development → .env.production"
            cp .env.development .env.production
          else
            echo "→ PROD build: keeping .env.production as-is"
          fi
        - echo "Installing aws cli ..."
        - apt-get update && apt-get install -y awscli
        - echo "Fetching secrets from SSM..."
        - echo "AUTH_SECRET=$(aws ssm get-parameter --name "/nexiam/frontend/admin/AUTH_SECRET" --with-decryption --query "Parameter.Value" --output text)" >> .env.production
        - echo "COGNITO_USER_POOL_ID=$(aws ssm get-parameter --name "/nexiam/frontend/common/COGNITO_USERPOOL_ID" --with-decryption --query "Parameter.Value" --output text)" >> .env.production
        - echo "COGNITO_USER_POOL_CLIENT_ID=$(aws ssm get-parameter --name "/nexiam/frontend/admin/COGNITO_USERPOOL_CLIENT_ID" --with-decryption --query "Parameter.Value" --output text)" >> .env.production
    build:
      commands:
        - echo "Starting build process..."
        - pnpm run build
        - echo "Build completed successfully."
    postBuild:
      commands:
        - echo "postBuild completed successfully."
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - ".pnpm-store/**/*"
