version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "NODE_ENV is set to $NODE_ENV"
        - node --version
        - echo "Install bun (version from package.json)..."
        - export BUN_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1]")
        - echo "Installing bun v$BUN_VERSION..."
        - curl -fsSL https://bun.sh/install | bash -s "bun-v$BUN_VERSION"
        - export BUN_INSTALL="$HOME/.bun"
        - export PATH="$BUN_INSTALL/bin:$PATH"
        - bun --version
        - echo "Installing dependencies..."
        - bun install --frozen-lockfile
        # if we're in dev, swap .env.production for .env.development
        - echo "ENV is '$ENV'"
        - |
            if [ "$ENV" = "dev" ]; then
              echo "→ DEV build: copying .env.development → .env.production"
              cp .env.development .env.production
            else
              echo "→ PROD build: keeping .env.production as-is"
            fi
        - echo "Installing aws cli ..."
        # - apt-get update && apt-get install -y awscli
        - |
            set -euo pipefail
            echo "Fetching secrets from SSM..."
            # Remove existing keys so appended values take effect
            sed -i '/^DATABASE_URL=/d' .env.production
            sed -i '/^PAYLOAD_SECRET=/d' .env.production
            # Append secrets from SSM with quoted values
            echo "" >> .env.production
            printf "DATABASE_URL=%s\n" "$(aws ssm get-parameter --name "/nexiam/frontend/admin/DATABASE_URL" --with-decryption --query "Parameter.Value" --output text)" >> .env.production
            printf "PAYLOAD_SECRET=%s\n" "$(aws ssm get-parameter --name "/nexiam/frontend/admin/PAYLOAD_SECRET" --with-decryption --query "Parameter.Value" --output text)" >> .env.production
            echo "Secrets fetched successfully."
        - echo "Running Payload CMS database migrations..."
        - set -euo pipefail && bun run payload migrate
    build:
      commands:
        - echo "Starting build process..."
        - export BUN_INSTALL="$HOME/.bun"
        - export PATH="$BUN_INSTALL/bin:$PATH"
        - bun run build
        - echo "Build completed successfully."
    postBuild:
      commands:
        - echo "postBuild completed successfully."
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - "node_modules/**/*" # Installed dependencies
      - ".next/cache/**/*" # Next.js build cache (webpack, pages)
      - "$HOME/.bun/install/cache/**/*" # Bun's global package cache
