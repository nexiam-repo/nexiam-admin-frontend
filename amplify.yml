version: 1
frontend:
  phases:
    preBuild:
      commands:
        - node --version
        - echo $ENVIRONMENT
        - echo "NODE_ENV is set to $NODE_ENV"
        - node --version
        - echo "Installing corepack and pnpm..."
        - npm install --global corepack@latest
        - corepack enable
        - corepack prepare pnpm@latest-10 --activate
        - pnpm config set store-dir ~/.pnpm-store
        - pnpm store path
        - pnpm install --frozen-lockfile
        # if we're in dev, swap .env.production for .env.development
        - echo "ENV is '$ENV'"
        - |
          if [ "$ENV" = "dev" ]; then
            echo "→ DEV build: copying .env.development → .env.production"
            cp .env.development .env.production
          else
            echo "→ PROD build: keeping .env.production as-is"
          fi
        - echo "AUTH_SECRET=${AUTH_SECRET}" >> .env.production
        - echo "AUTH_COGNITO_ID=${AUTH_COGNITO_ID}" >> .env.production
        - echo "AUTH_COGNITO_SECRET=${AUTH_COGNITO_SECRET}" >> .env.production
        - echo "AUTH_COGNITO_ISSUER=${AUTH_COGNITO_ISSUER}" >> .env.production
        - echo "Secrets:$secrets"
    build:
      commands:
        - echo "Starting build process..."
        - pnpm run build
        - echo "Build completed successfully."
    postBuild:
      commands:
        - echo "postBuild completed successfully."
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - ".pnpm-store/**/*"
