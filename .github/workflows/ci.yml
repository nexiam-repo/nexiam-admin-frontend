name: CI

# PR quality gate. Runs on every PR regardless of target branch.
# Intentionally scope-limited: lint only (for now). No build, no deploy, no AWS creds.
# Deploys are handled by deploy-dev.yml / deploy-prod.yml on branch push.
#
# The `test` job is commented out until real tests exist — running it today
# would just burn GHA minutes on checkout + install + `echo TODO`. Uncomment
# the block below (and set `run: bun run test`) once tests are wired up.

on:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Biome
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `biome ci` is the CI-optimized mode: no --write, fails on any
      # lint/format/organize-imports diagnostic. Stricter than `biome check`.
      # Use `bun run` so the local pinned biome version is used.
      - name: Biome check
        run: bun run ci:check

